name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      singbox_pkg_version: ${{ steps.singbox_ver.outputs.pkg_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: echo "release_tag=$(date -u +%Y.%m.%d)-r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve sing-box version
        id: singbox_ver
        run: |
          pkg_version="$(sed -n 's/^PKG_VERSION:=//p' sing-box/Makefile)"
          pkg_release="$(sed -n 's/^PKG_RELEASE:=//p' sing-box/Makefile)"
          [[ -n "$pkg_version" && -n "$pkg_release" ]]
          echo "pkg_version=${pkg_version}-r${pkg_release}" >> "$GITHUB_OUTPUT"

  build-homeproxy:
    name: Build homeproxy (apk/ipk)
    needs: tag
    runs-on: ubuntu-latest
    env:
      APK_SIGN_KEY: ''
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Checkout apk
        uses: actions/checkout@v6
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build jq unzip

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=libfetch \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Setup APK signing key
        run: |
          if [ -n "${{ secrets.APK_SIGNING_KEY }}" ]; then
            echo "${{ secrets.APK_SIGNING_KEY }}" > /tmp/apk-signing.key
            chmod 600 /tmp/apk-signing.key
            openssl rsa -in /tmp/apk-signing.key -pubout -out .github/homeproxy.pub 2>/dev/null || \
            openssl ec  -in /tmp/apk-signing.key -pubout -out .github/homeproxy.pub 2>/dev/null || true
            echo "APK_SIGN_KEY=/tmp/apk-signing.key" >> $GITHUB_ENV
          else
            echo "No APK_SIGNING_KEY secret set — building unsigned package"
          fi

      - name: Build apk/ipk file
        run: |
          pushd .github
          fakeroot bash build-ipk.sh apk workflow_dispatch
          fakeroot bash build-ipk.sh ipk workflow_dispatch
          popd

      - name: Collect package
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          cp -p .github/*.apk .github/*.ipk "$RUNNER_TEMP/output/"
          [ -f .github/homeproxy.pub ] && cp -p .github/homeproxy.pub "$RUNNER_TEMP/output/" || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-packages
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  build-singbox:
    name: Build Sing-Box (${{ matrix.platform_name }}, ${{ matrix.pkg_format }})
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ARM64
            pkg_format: apk
            arch_suffix: arm64
            sdk_base: snapshots
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
            replace_golang: false
          - platform_name: AMD64
            pkg_format: apk
            arch_suffix: x86_64
            sdk_base: snapshots
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'
            replace_golang: false
          - platform_name: ARM64
            pkg_format: ipk
            arch_suffix: arm64
            sdk_base: releases/24.10.6
            sdk_path: qualcommax/ipq807x
            sdk_prefix: immortalwrt-sdk-24.10.6-qualcommax-ipq807x_gcc-13.3.0_
            target: qualcommax
            subtarget: ipq807x
            replace_golang: true
          - platform_name: AMD64
            pkg_format: ipk
            arch_suffix: x86_64
            sdk_base: releases/24.10.6
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_
            target: x86
            subtarget: '64'
            replace_golang: true

    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/${{ matrix.sdk_base }}/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip xsltproc zip zlib1g-dev zstd

      - name: Setup Go
        if: matrix.pkg_format == 'ipk'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Locate SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"

          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"

          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Download SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          archive="$RUNNER_TEMP/sdk/$SDK_ARCHIVE"

          curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive"
          echo "$SDK_SHA256  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/sdk-root"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/sdk-root"
          echo "SDK_ROOT=$(find "$RUNNER_TEMP/sdk-root" -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Prepare package
        run: |
          rm -rf "$SDK_ROOT/package/sing-box"
          cp -a sing-box "$SDK_ROOT/package/sing-box"

      - name: Update and install feeds
        if: matrix.pkg_format == 'apk'
        run: |
          "$SDK_ROOT/scripts/feeds" update -a
          "$SDK_ROOT/scripts/feeds" install -a

      - name: Replace OpenWrt Golang
        if: matrix.pkg_format == 'ipk'
        run: |
          cd "$SDK_ROOT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/packages/lang/golang
          git clone --depth=1 -b 26.x https://github.com/sbwml/packages_lang_golang feeds/packages/lang/golang
          ./scripts/feeds install -f golang

      - name: Configure only Sing-Box
        run: |
          cat > "$SDK_ROOT/.config" <<EOF
          CONFIG_TARGET_${{ matrix.target }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          $( [[ "${{ matrix.pkg_format }}" == "ipk" ]] && echo "CONFIG_PACKAGE_golang=y" )
          CONFIG_PACKAGE_sing-box=m
          EOF

          make -C "$SDK_ROOT" defconfig

      - name: Compile only Sing-Box
        run: |
          make -C "$SDK_ROOT" package/sing-box/clean
          make -C "$SDK_ROOT" -j"$(nproc)" package/sing-box/compile || \
            make -C "$SDK_ROOT" -j1 package/sing-box/compile V=s

      - name: Collect package
        env:
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          PKG_FORMAT: ${{ matrix.pkg_format }}
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          found=0

          if [[ "$PKG_FORMAT" == "apk" ]]; then
            while IFS= read -r -d '' apk; do
              metadata="$("$SDK_ROOT/staging_dir/host/bin/apk" adbdump "$apk")"
              name="$(awk '/^  name: / { sub(/^  name: /, ""); print; exit }' <<< "$metadata")"

              if [[ "$name" == "sing-box" ]]; then
                base="$(basename "$apk")"
                version_part="${base#sing-box-}"
                version_part="${version_part%.apk}"
                cp -p "$apk" "$RUNNER_TEMP/output/sing-box_${ARCH_SUFFIX}-${version_part}.apk"
                found=$((found + 1))
              fi
            done < <(find "$SDK_ROOT/bin" -type f -name 'sing-box-*.apk' -print0)

            [[ "$found" -eq 1 ]]
          else
            while IFS= read -r -d '' ipk; do
              control_dir="$(mktemp -d)"
              (
                cd "$control_dir" || exit 1
                if tar -tzf "$ipk" >/dev/null 2>&1; then
                  tar -xzf "$ipk"
                else
                  ar x "$ipk"
                fi
                tar -xzf control.tar.gz 2>/dev/null || true
              )
              name="$(awk -F': ' '/^Package:/ { print $2; exit }' "$control_dir/control" 2>/dev/null)"
              rm -rf "$control_dir"

              if [[ "$name" == "sing-box" ]]; then
                base="$(basename "$ipk")"
                version_part="${base#sing-box_}"
                version_part="${version_part%%_*}"
                cp -p "$ipk" "$RUNNER_TEMP/output/sing-box_${ARCH_SUFFIX}-${version_part}.ipk"
                found=$((found + 1))
              fi
            done < <(find "$SDK_ROOT/bin" -type f -name 'sing-box_*.ipk' -print0)

            [[ "$found" -ge 1 ]]
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.pkg_format }}-${{ matrix.platform_name }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [tag, build-homeproxy, build-singbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Flatten packages
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -exec cp -t "$RUNNER_TEMP/release" {} +

          echo "=== SHA256SUMS (log only, not published to the release) ==="
          cd "$RUNNER_TEMP/release"
          sha256sum -- *

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.release_tag }}
          TITLE: ${{ needs.tag.outputs.release_tag }} (homeproxy + sing-box ${{ needs.tag.outputs.singbox_pkg_version }})
        run: |
          cd "$RUNNER_TEMP/release"

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes "Combined automated build: luci-app-homeproxy and sing-box (sing-box-extended) ${{ needs.tag.outputs.singbox_pkg_version }}." \
            -- * \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
